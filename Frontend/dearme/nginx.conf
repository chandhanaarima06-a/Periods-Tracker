# DearMe frontend — nginx config
# Listens on 8080 (Railway's default PORT), serves the built React app,
# and falls back to index.html for client-side routes (SPA routing).

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Hashed asset files (e.g. /static/js/main.<hash>.js) never change between
    # builds, so browsers may cache them for a year.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Every other path: serve the file if it exists, otherwise serve index.html.
    # This is what makes React Router work — /calendar, /diary, etc. all render
    # via client-side routing instead of 404ing.
    location / {
        try_files $uri /index.html;
    }
}
